[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Astro 6.1.4 requiere Node >= 22.12.0 (según package.json -> engines)
  NODE_VERSION = "22.22.2"
  # Forzar el registry público (evita ETARGET en mirrors/proxies)
  NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"
